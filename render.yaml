# Render.com deployment config for WDC App
services:
  - type: web
    name: wdc-app
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      # Firebase
      - key: USE_FIREBASE
        value: "true"

      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/serviceAccountKey.json

      # JWT
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: JWT_EXPIRE_HOURS
        value: "12"

      # Bootstrap Admin
      - key: DEFAULT_SUPER_ADMIN_EMAIL
        value: admin@wdc.edu

      - key: DEFAULT_SUPER_ADMIN_PASSWORD
        sync: false

      # CORS
      - key: CORS_ORIGINS
        value: "*"

      # Email
      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: EMAIL_FROM
        value: wdc-noreply@example.local

    healthCheckPath: /api/health
    autoDeploy: true